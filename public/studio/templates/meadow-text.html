<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>meadow-text</title>
<link rel="stylesheet" href="./studio.css">
<style>
  .panel{left:70px;top:520px;width:940px;height:700px}
  .panel__in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:60px 64px}
  .panel .title{font-size:100px}
  .panel.is-hook .title{font-size:108px}
  .panel .wm{font-size:76px;justify-content:center}
  .panel .frame-line{font:500 32px/1.35 var(--sans);letter-spacing:.06em;color:var(--ink-2);text-align:center}
</style>
</head>
<body>
<video class="meadow" src="../media/meadow-loop-tall.mp4" poster="../media/meadow-poster-tall.jpg" autoplay muted loop playsinline></video>
<div class="brand"><span class="brand__glyph">☉&#xFE0E;</span><span class="brand__name">The Astro Study</span></div>
<div class="glass panel" id="panel"><div class="panel__in" id="panel-in"></div></div>
<div class="captions"><div class="captions__bar" id="caption"></div></div>
<script src="./engine.js"></script>
<script>
defineTemplate({
  glass() {
    return [{ x: 70, y: 520, w: 940, h: 700, r: 44 }];
  },
  build() {},
  show(state, spec, timeline, h) {
    const scene = timeline.scenes[state.scene] || { kind: "line", text: "" };
    const panel = document.getElementById("panel");
    const inner = document.getElementById("panel-in");
    panel.classList.toggle("is-hook", scene.kind === "hook");
    if (scene.kind === "disclosure") {
      inner.innerHTML = '<div class="wm"><span class="wm__dot"></span><span>The Astro <em>Study</em></span></div>' +
        '<p class="frame-line">' + h.esc(spec.disclosure_text || "") + "</p>";
    } else {
      let text = h.esc(scene.text);
      const key = spec.emphasis ? h.esc(spec.emphasis) : "";
      if (key && scene.kind === "hook") {
        const i = text.toLowerCase().indexOf(key.toLowerCase());
        if (i >= 0) text = text.slice(0, i) + '<span class="sunword">' + text.slice(i, i + key.length) + "</span>" + text.slice(i + key.length);
      }
      inner.innerHTML = '<p class="title" data-fit="' + (scene.kind === "hook" ? 54 : 46) + '">' + h.plain(text) + "</p>";
    }
    h.fit(inner);
    const cap = timeline.captions[state.caption];
    document.getElementById("caption").textContent = scene.kind === "disclosure" || !cap ? "" : cap.text;
  },
});
</script>
</body>
</html>
