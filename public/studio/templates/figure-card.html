<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>figure-card</title>
<link rel="stylesheet" href="./studio.css">
<style>
  .figure{left:70px;top:330px;width:940px;height:600px}
  .figure__in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:54px 62px}
  .n{font-family:var(--serif);font-weight:300;font-size:250px;line-height:.92;letter-spacing:-.045em;white-space:nowrap}
  .rule{width:140px;height:4px;background:var(--accent);border-radius:2px}
  .say{font-family:var(--serif);font-weight:340;font-size:56px;line-height:1.12;letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
  .src{font:500 22px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .line{left:70px;top:980px;width:940px;height:310px}
  .line__in{position:absolute;inset:0;display:flex;align-items:center;padding:40px 56px}
  .line .title{font-size:66px}
  .line .wm{font-size:70px;justify-content:center;width:100%}
</style>
</head>
<body>
<video class="meadow" src="../media/meadow-loop-tall.mp4" poster="../media/meadow-poster-tall.jpg" autoplay muted loop playsinline></video>
<div class="brand"><span class="brand__glyph">☉&#xFE0E;</span><span class="brand__name">The Astro Study</span></div>
<div class="glass figure"><div class="figure__in" id="figure-in"></div></div>
<div class="glass line"><div class="line__in" id="line-in"></div></div>
<div class="captions"><div class="captions__bar" id="caption"></div></div>
<script src="./engine.js"></script>
<script>
defineTemplate({
  glass() {
    return [{ x: 70, y: 330, w: 940, h: 600, r: 44 }, { x: 70, y: 980, w: 940, h: 310, r: 44 }];
  },
  build(spec, h) {
    const f = spec.figure || { value: "", label: "", source: "" };
    const inner = document.getElementById("figure-in");
    inner.innerHTML = '<p class="n" data-fit="100"><span class="sunword">' + h.esc(f.value) + '</span></p><div class="rule"></div>' +
      '<p class="say" data-fit="30">' + h.esc(f.label) + '</p><p class="src">' + h.esc(f.source) + "</p>";
    h.fit(inner);
  },
  show(state, spec, timeline, h) {
    const scene = timeline.scenes[state.scene] || { kind: "line", text: "" };
    const inner = document.getElementById("line-in");
    inner.innerHTML = scene.kind === "disclosure"
      ? '<div class="wm"><span class="wm__dot"></span><span>The Astro <em>Study</em></span></div>'
      : '<p class="title" data-fit="38">' + h.plain(h.esc(scene.text)) + "</p>";
    h.fit(inner);
    const cap = timeline.captions[state.caption];
    document.getElementById("caption").textContent = scene.kind === "disclosure" ? spec.disclosure_text || "" : cap ? cap.text : "";
  },
});
</script>
</body>
</html>
