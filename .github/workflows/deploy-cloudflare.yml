name: Deploy to Cloudflare

# Backup host next to Vercel. Runs on every push to main, or by hand from
# GitHub → Actions → "Deploy to Cloudflare" → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret $name (see DEPLOY.md)"; missing=1; fi
          done
          exit $missing

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Server-side keys go to the Worker as encrypted secrets (never in git).
      - name: Sync server secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FREE_ASTRO_API_KEY: ${{ secrets.FREE_ASTRO_API_KEY }}
        run: |
          file="$RUNNER_TEMP/worker-secrets.json"
          node -e '
            const out = {};
            for (const k of ["ANTHROPIC_API_KEY", "FREE_ASTRO_API_KEY"]) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out));
            console.log("Syncing:", Object.keys(out).join(", ") || "nothing");
          ' "$file"
          npx wrangler secret bulk "$file"
          rm -f "$file"
